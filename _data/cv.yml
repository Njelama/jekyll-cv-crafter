researchInterests: >-
  My research focuses on PFAS, colloid and interface science, and water treatment, with a particular interest in translating physicochemical insights into practical remediation technologies. I am seeking postdoctoral and research or industry opportunities in PFAS remediation, analytical and physical chemistry, soft matter, and environmental treatment, with a long-term goal of developing an independent research programme in Zambia that connects fundamental chemistry with environmental remediation and scientific capacity building.

career:
 - position: PhD Researcher, Polymer & Colloid Chemistry
   company: Uppsala University
   location: Sweden
   dates: Oct 2021 – Oct 2025
   summary: Designed and executed a 4-year experimental research programme on PFAS surfactant self-assembly and aggregation in aqueous systems, evaluating the effects of counterions, concentration, and temperature on micellar structure and interactions.
   accomplishments:
    - accomplishment: Investigated interfacial interactions between fluorinated surfactants and Moringa oleifera seed protein systems using neutron reflectometry.
    - accomplishment: Planned and coordinated 8+ experimental campaigns at international neutron scattering facilities, collaborating with multidisciplinary research teams across multiple countries.
    - accomplishment: Performed experimental troubleshooting, uncertainty evaluation, and optimisation of measurement conditions, reducing sample preparation time by approximately 40% through workflow redesign.
    - accomplishment: Interpreted complex experimental datasets and translated findings into scientific conclusions, technical reports, peer-reviewed publications, and conference presentations.
 - position: Staff Development Fellow, Department of Chemistry
   company: University of Zambia
   location: Zambia
   dates: Jul 2017 – Present
   summary: On leave for doctoral studies during 2021–2025; undergraduate teaching and academic capacity development.
   accomplishments:
    - accomplishment: Delivered laboratory demonstrations and tutorials in Physical Chemistry and first-year general chemistry to undergraduate cohorts of 120+ students.
    - accomplishment: Designed and implemented two new practical chemistry modules, including experimental procedures and safety documentation.
    - accomplishment: Assessed assignments, tests, and examinations, and supported students in scientific problem-solving and technical report writing.
    - accomplishment: Selected for a competitive academic staff development pathway supporting future research and teaching capacity within the department.

