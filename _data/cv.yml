doctoralThesis:
  title: "Self-assembly of fluorocarbon amphiphiles and their interactions at interfaces with a seed protein"
  citation: "Sanga, N. (2025). Self-assembly of fluorocarbon amphiphiles and their interactions at interfaces with a seed protein. Doctoral thesis, comprehensive summary. Uppsala: Acta Universitatis Upsaliensis. Digital Comprehensive Summaries of Uppsala Dissertations from the Faculty of Science and Technology, 2607."
  link: https://uu.diva-portal.org/smash/get/diva2:2009389/FULLTEXT01.pdf
  repository: https://urn.kb.se/resolve?urn=urn:nbn:se:uu:diva-570586
  description: "Doctoral research on the physicochemical properties, self-assembly, hydration and interactions of perfluorooctanoate-based PFAS surfactants, using small-angle X-ray/neutron scattering and neutron reflection, including interactions with Moringa oleifera seed protein."

