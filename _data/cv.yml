completedProjects:
  - name: "MSc Research — Verification of a Baromembrane Method for Concentrating Water Samples"
    dates: "2019–2021"
    institution: "Ural Federal University"
    description: "Completed MSc research investigating a reverse-osmosis baromembrane method for concentrating water samples containing manganese, cobalt, strontium and caesium. The study evaluated concentration behaviour across repeated membrane cycles and assessed the potential to improve the sensitivity of radiometric, radiochemical and spectrometric measurements of radioactive isotopes."
    skills:
      - "Reverse osmosis and baromembrane filtration"
      - "Water sample preparation and concentration"
      - "Stable and radioactive isotope handling"
      - "Mass spectrometry"
      - "Conductivity measurements"
      - "Concentration and demineralisation coefficient calculations"
      - "Experimental optimisation and troubleshooting"
      - "Radiometric, radiochemical and spectrometric method development"
    outcome: "The baromembrane method demonstrated the ability to concentrate the investigated elements and reduce sample volume by up to 20-fold, supporting subsequent radiometric or spectrometric analysis."
    document: ""
