<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Schematic comparison of magnesium and sodium perfluorooctanoate micelles</title><desc id="desc">A core-shell cylinder for magnesium perfluorooctanoate and a core-shell prolate ellipsoid for sodium perfluorooctanoate, based on Figure 7 of Sanga et al., RSC Advances 2026.</desc><style>text{font-family:Arial,sans-serif;fill:#222}.label{font-size:20px;font-weight:600}.small{font-size:17px}.legend{font-size:16px}.tail{stroke:#e67e22;stroke-width:3;fill:none;stroke-linecap:round}.water{fill:#20a9df}.mg{fill:none;stroke:#e53935;stroke-width:3}.na{fill:none;stroke:#42a35a;stroke-width:3}.shell{fill:none;stroke:#222;stroke-width:3}.core{fill:#fff3e6;stroke:#222;stroke-width:2}</style><text x="450" y="38" text-anchor="middle" class="label">Core–shell micelle comparison</text><rect x="170" y="95" width="210" height="300" rx="105" class="shell"/><rect x="182" y="107" width="186" height="276" rx="93" class="core"/><g class="tail"><path d="M215 145 l35 35"/><path d="M245 125 l35 35"/><path d="M280 120 l35 35"/><path d="M315 135 l30 35"/><path d="M205 185 l40 35"/><path d="M240 175 l40 35"/><path d="M285 170 l35 35"/><path d="M325 185 l25 30"/><path d="M205 235 l40 35"/><path d="M245 225 l40 35"/><path d="M290 220 l35 35"/><path d="M330 240 l20 25"/><path d="M210 285 l40 35"/><path d="M250 275 l40 35"/><path d="M295 275 l35 35"/><path d="M330 295 l20 20"/><path d="M220 335 l35 30"/><path d="M260 325 l35 30"/><path d="M300 330 l30 25"/></g><g class="water"><circle cx="195" cy="135" r="8"/><circle cx="350" cy="150" r="8"/><circle cx="195" cy="215" r="8"/><circle cx="350" cy="230" r="8"/><circle cx="200" cy="310" r="8"/><circle cx="345" cy="330" r="8"/><circle cx="260" cy="105" r="8"/><circle cx="315" cy="385" r="8"/></g><g class="mg"><circle cx="215" cy="125" r="8"/><circle cx="340" cy="185" r="8"/><circle cx="210" cy="270" r="8"/><circle cx="340" cy="285" r="8"/><circle cx="270" cy="380" r="8"/></g><text x="275" y="435" text-anchor="middle" class="label">Magnesium perfluorooctanoate</text><text x="275" y="465" text-anchor="middle" class="small">Core–shell cylinder · length ≈ 86 Å at 25 °C</text><ellipse cx="650" cy="245" rx="120" ry="175" class="shell"/><ellipse cx="650" cy="245" rx="108" ry="163" class="core"/><g class="tail"><path d="M620 120 l45 35"/><path d="M650 110 l45 35"/><path d="M590 155 l50 35"/><path d="M660 155 l45 35"/><path d="M575 205 l55 35"/><path d="M650 205 l55 35"/><path d="M575 260 l55 35"/><path d="M650 270 l55 35"/><path d="M590 320 l50 35"/><path d="M650 330 l45 30"/></g><g class="water"><circle cx="560" cy="180" r="8"/><circle cx="735" cy="190" r="8"/><circle cx="555" cy="285" r="8"/><circle cx="735" cy="300" r="8"/><circle cx="610" cy="100" r="8"/><circle cx="690" cy="390" r="8"/></g><g class="na"><circle cx="585" cy="130" r="8"/><circle cx="720" cy="245" r="8"/><circle cx="585" cy="350" r="8"/><circle cx="710" cy="355" r="8"/></g><text x="650" y="435" text-anchor="middle" class="label">Sodium perfluorooctanoate</text><text x="650" y="465" text-anchor="middle" class="small">Core–shell prolate ellipsoid · polar radius ≈ 18 Å</text><text x="395" y="120" class="small">Mg shell thickness ≈ 4 Å</text><text x="760" y="115" class="small">Na shell thickness ≈ 3 Å</text><circle cx="350" cy="495" r="7" class="water"/><text x="365" y="501" class="legend">water</text><circle cx="445" cy="495" r="7" class="mg"/><text x="460" y="501" class="legend">Mg²⁺</text><circle cx="535" cy="495" r="7" class="na"/><text x="550" y="501" class="legend">Na⁺</text><text x="450" y="518" text-anchor="middle" font-size="12">Adapted from Fig. 7, Sanga et al., RSC Adv. 2026, 16, 47235–47245 (CC BY 4.0)</text></svg>